<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0cf7b" />
      <stop offset="50%" stop-color="#c99a35" />
      <stop offset="100%" stop-color="#8c6518" />
    </linearGradient>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1f1b13" />
      <stop offset="100%" stop-color="#0d0d0d" />
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="url(#goldGrad)" stroke-width="8" opacity="0.8" />
  
  <!-- Outer Gold Ring -->
  <circle cx="256" cy="256" r="195" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-dasharray="8 6" opacity="0.6"/>

  <!-- Scissors and Barber Pole / Razor Motif -->
  <g transform="translate(256,230) scale(1.15)">
    <!-- Scissor Blade 1 -->
    <path d="M-55,55 L35,-65 C45,-78 65,-65 55,-50 L-35,70 Z" fill="url(#goldGrad)" />
    <!-- Scissor Blade 2 -->
    <path d="M55,55 L-35,-65 C-45,-78 -65,-65 -55,-50 L35,70 Z" fill="url(#goldGrad)" />
    <!-- Center Pivot Pin -->
    <circle cx="0" cy="5" r="9" fill="#111" stroke="#f0cf7b" stroke-width="4" />
    <!-- Scissor Handle 1 -->
    <ellipse cx="-65" cy="85" rx="22" ry="32" fill="none" stroke="url(#goldGrad)" stroke-width="8" transform="rotate(-25 -65 85)" />
    <!-- Scissor Handle 2 -->
    <ellipse cx="65" cy="85" rx="22" ry="32" fill="none" stroke="url(#goldGrad)" stroke-width="8" transform="rotate(25 65 85)" />
    <!-- Crown / Star Accent on top -->
    <path d="M-22,-95 L0,-125 L22,-95 L12,-90 L0,-105 L-12,-90 Z" fill="url(#goldGrad)" />
  </g>

  <!-- Brand Typography in Icon -->
  <text x="256" y="420" font-family="'Figtree', 'Arial', sans-serif" font-size="34" font-weight="900" fill="#f0cf7b" text-anchor="middle" letter-spacing="4">AFONSO</text>
  <text x="256" y="445" font-family="'Figtree', 'Arial', sans-serif" font-size="16" font-weight="700" fill="#c99a35" text-anchor="middle" letter-spacing="6">CORTES</text>
</svg>